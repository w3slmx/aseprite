name: Package Aseprite Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: aseprite/get-ninja@main

      - name: Download matching Skia
        run: |
          set -euo pipefail
          skia_url=$(bash laf/misc/skia-url.sh release windows x64 | xargs)
          test -n "$skia_url"
          curl --fail --location --retry 3 --ssl-revoke-best-effort \
            "$skia_url" --output "$RUNNER_TEMP/skia.zip"
          unzip -q "$RUNNER_TEMP/skia.zip" -d "$RUNNER_TEMP/skia"
          test -f "$RUNNER_TEMP/skia/out/Release-x64/skia.lib"

      - name: Configure
        run: |
          set -euo pipefail
          skia_dir=$(cygpath -m "$RUNNER_TEMP/skia")
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            "-DSKIA_DIR=$skia_dir" \
            "-DSKIA_LIBRARY_DIR=$skia_dir/out/Release-x64" \
            "-DSKIA_LIBRARY=$skia_dir/out/Release-x64/skia.lib"

      - name: Compile
        run: cmake --build build --target aseprite --parallel 2

      - name: Check package
        run: |
          set -euo pipefail
          test -f build/bin/aseprite.exe
          test -d build/bin/data
          build/bin/aseprite.exe --version

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows-x64
          path: build/bin/
          if-no-files-found: error
          retention-days: 30

