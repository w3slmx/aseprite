name: Package Aseprite Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: aseprite/get-ninja@main

      - name: Download matching Skia
        run: |
          set -euo pipefail
          skia_url=$(bash laf/misc/skia-url.sh release windows x64 | xargs)
          test -n "$skia_url"
          curl --fail --location --retry 3 --ssl-revoke-best-effort \
            "$skia_url" --output "$RUNNER_TEMP/skia.zip"
          unzip -q "$RUNNER_TEMP/skia.zip" -d "$RUNNER_TEMP/skia"
          test -f "$RUNNER_TEMP/skia/out/Release-x64/skia.lib"

      - name: Configure
        run: |
          set -euo pipefail
          skia_dir=$(cygpath -m "$RUNNER_TEMP/skia")
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            "-DSKIA_DIR=$skia_dir" \
            "-DSKIA_LIBRARY_DIR=$skia_dir/out/Release-x64" \
            "-DSKIA_LIBRARY=$skia_dir/out/Release-x64/skia.lib"

      - name: Compile
        run: cmake --build build --target aseprite --parallel 2

      - name: Bundle runtime DLLs
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/bundle-runtime.cmake" <<'CMAKE'
          cmake_minimum_required(VERSION 3.21)
          set(CMAKE_GET_RUNTIME_DEPENDENCIES_PLATFORM "windows+pe")
          set(CMAKE_GET_RUNTIME_DEPENDENCIES_TOOL "dumpbin")
          find_program(CMAKE_GET_RUNTIME_DEPENDENCIES_COMMAND dumpbin REQUIRED)
          file(TO_CMAKE_PATH "$ENV{PATH}" runtime_search_dirs)
          file(GET_RUNTIME_DEPENDENCIES
            EXECUTABLES "${EXE}"
            DIRECTORIES ${runtime_search_dirs}
            RESOLVED_DEPENDENCIES_VAR runtime_dlls
            UNRESOLVED_DEPENDENCIES_VAR missing_dlls
            PRE_EXCLUDE_REGEXES "api-ms-.*" "ext-ms-.*"
            POST_EXCLUDE_REGEXES [[.*[\\/][Ww][Ii][Nn][Dd][Oo][Ww][Ss][\\/].*]])
          if(missing_dlls)
            message(FATAL_ERROR "Unresolved runtime DLLs: ${missing_dlls}")
          endif()
          get_filename_component(package_dir "${EXE}" DIRECTORY)
          foreach(dll IN LISTS runtime_dlls)
            message(STATUS "Bundling ${dll}")
            file(COPY "${dll}" DESTINATION "${package_dir}")
          endforeach()
          CMAKE
          cmake "-DEXE=$(cygpath -m "$PWD/build/bin/aseprite.exe")" \
            -P "$RUNNER_TEMP/bundle-runtime.cmake"

      - name: Check package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'build/bin/data')) { throw 'Missing data directory' }
          $exe = (Resolve-Path 'build/bin/aseprite.exe').Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -NoNewWindow -Wait -PassThru
          Write-Host "Packaged executable exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable failed with exit code $($process.ExitCode)"
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows-x64
          path: build/bin/
          if-no-files-found: error
          retention-days: 30
